name: Bug
description: Something is broken or behaves differently than it should.
labels: [bug]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you saw, including error messages, screenshots and links.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How we'll know it's fixed. A failing test that reproduces the bug is the best version of this.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Affected customers, how often it happens, related issues or PRs, and where in the code to start looking if you know.
