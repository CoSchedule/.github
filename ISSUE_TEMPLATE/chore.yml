name: Chore
description: Maintenance, cleanup, dependency or tooling work.
labels: [chore]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      placeholder: |
        - [ ] ...
    validations:
      required: true
