name: Feature
description: A new capability or a change to how something works.
labels: [Enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what it costs them today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, from the user's point of view.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, checkable outcomes. Each one should be something a reviewer or a test can verify.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this deliberately doesn't cover.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Designs, related decisions in docs/decisions/, and the files or interfaces involved if you know them.
